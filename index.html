<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saikci - 个人网站</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 导航栏 -->
    <nav>
        <ul>
            <li><a href="#home">首页</a></li>
            <li><a href="#about">关于</a></li>
            <li><a href="#projects">项目</a></li>
            <li><a href="#contact">联系</a></li>
        </ul>
    </nav>

    <!-- 主页横幅 -->
    <section class="hero" id="home">
        <h1>欢迎来到 Saikci 的个人网站</h1>
        <p>探索技术，创造未来</p>
    </section>

    <!-- 主要内容 -->
    <div class="container">
        <!-- 关于部分 -->
        <section id="about">
            <h2>关于我们</h2>
            <div class="card">
                <h3>个人简介</h3>
                <p>这里可以介绍你自己，包括你的技能、经验和兴趣。这是一个展示你个人特色的好地方。</p>
            </div>
        </section>

        <!-- 项目部分 -->
        <section id="projects">
            <h2>项目展示</h2>
            <div class="card-grid">
                <div class="card">
                    <h3>项目一</h3>
                    <p>描述你的第一个项目，包括使用的技术和项目亮点。</p>
                </div>
                <div class="card">
                    <h3>项目二</h3>
                    <p>描述你的第二个项目，展示你的技能和经验。</p>
                </div>
                <div class="card">
                    <h3>项目三</h3>
                    <p>描述你的第三个项目，突出创新点和技术挑战。</p>
                </div>
            </div>
        </section>

        <!-- 联系部分 -->
        <section id="contact">
            <h2>联系我们</h2>
            <div class="contact-form">
                <form>
                    <div class="form-group">
                        <label for="name">姓名</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">邮箱</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="message">留言</label>
                        <textarea id="message" name="message" required></textarea>
                    </div>
                    <button type="submit">发送消息</button>
                </form>
            </div>
        </section>
    </div>

    <!-- 页脚 -->
    <footer>
        <p>&copy; 2026 Saikci. 保留所有权利。</p>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
